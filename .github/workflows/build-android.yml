name: Build Android APK

on:
  push:
    branches: [ main, master, dev ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Cache Buildozer dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          ~/.gradle/caches
          ~/.gradle/wrapper
          .buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec', 'requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip \
          autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev liblzma-dev \
          python3-pip python3-venv \
          libffi-dev libssl-dev \
          automake cmake \
          libgtk-3-dev
    
    - name: Configure Git and Network
      run: |
        # 配置 Git 使用 HTTPS 并设置重试
        git config --global http.sslVerify true
        git config --global http.postBuffer 524288000
        git config --global http.maxRequestBuffer 524288000
        git config --global http.lowSpeedLimit 1000
        git config --global http.lowSpeedTime 300
        
        # 配置 pip 重试
        pip3 config set global.retries 5
        pip3 config set global.timeout 120
    
    - name: Install Buildozer
      run: |
        pip3 install --upgrade pip
        pip3 install Cython==0.29.36
        pip3 install buildozer==1.5.0
        pip3 install virtualenv
        echo "$HOME/.local/bin" >> $GITHUB_PATH
    
    - name: Prepare build directory
      run: |
        echo "=== Project structure ==="
        ls -la
        echo ""
        echo "=== Data directory ==="
        ls -la data/ 2>/dev/null | head -10 || echo "No data directory"
        echo ""
        echo "=== Fonts directory ==="
        ls -la fonts/ 2>/dev/null || echo "No fonts directory"
        echo ""
        echo "=== Buildozer API config ==="
        cat buildozer.spec | grep -E "^android\.(api|minapi|ndk_api)" || true
    
    - name: Build APK with retry
      id: build_apk
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        
        # 设置环境变量增强稳定性
        export PYTHONHTTPSVERIFY=1
        export PIP_CERT=/etc/ssl/certs/ca-certificates.crt
        export SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
        export REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
        
        # 带重试的构建
        MAX_RETRIES=3
        RETRY_COUNT=0
        BUILD_SUCCESS=false
        
        while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$BUILD_SUCCESS" = "false" ]; do
          echo "=== Build attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES ==="
          
          if buildozer android debug 2>&1 | tee build.log; then
            BUILD_SUCCESS=true
            echo "=== Build successful! ==="
          else
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "=== Build failed, retrying in 30 seconds... ==="
              sleep 30
              # 清理可能损坏的缓存
              rm -rf .buildozer/android/platform/build-*/build/bootstrap_builds
            fi
          fi
        done
        
        if [ "$BUILD_SUCCESS" = "false" ]; then
          echo "=== Build failed after $MAX_RETRIES attempts ==="
          exit 1
        fi
        
        # 分析 build.log 查找 APK 路径
        echo ""
        echo "=== Analyzing build.log for APK path ==="
        if [ -f build.log ]; then
          echo "Searching for APK references in build.log..."
          grep -i "apk" build.log | grep -i "copy\|create\|save\|path" | tail -10 || echo "No APK path found in log"
        fi
      timeout-minutes: 90
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Find and copy APK
      id: find_apk
      run: |
        echo "=== Searching for APK files ==="
        
        mkdir -p release
        
        # 显示 .buildozer 完整目录结构
        echo "=== .buildozer directory tree ==="
        if [ -d ".buildozer" ]; then
          echo "Top level directories:"
          ls -la .buildozer/ | grep "^d" || echo "No subdirs"
          echo ""
          echo "android/platform structure:"
          if [ -d ".buildozer/android/platform" ]; then
            ls -la .buildozer/android/platform/ | head -10
          fi
          echo ""
          echo "Looking for build directories:"
          find .buildozer -maxdepth 5 -type d -name "build*" 2>/dev/null | head -10
          echo ""
          echo "Looking for dist/dists/bin directories:"
          find .buildozer -maxdepth 6 -type d \( -name "dist" -o -name "dists" -o -name "bin" \) 2>/dev/null | head -10
        else
          echo "::error::.buildozer directory does not exist!"
          exit 1
        fi
        
        # 方法 1: 使用 find 命令查找所有 APK 文件
        echo ""
        echo "=== ALL APK FILES FOUND (using find) ==="
        ALL_APKS=$(find .buildozer -name "*.apk" -type f 2>/dev/null)
        if [ -n "$ALL_APKS" ]; then
          APK_COUNT_FOUND=$(echo "$ALL_APKS" | wc -l)
          echo "Total APK files found: $APK_COUNT_FOUND"
          echo ""
          echo "APK file list:"
          echo "$ALL_APKS" | nl
          echo ""
          echo "Detailed info:"
          echo "$ALL_APKS" | while read -r apk; do
            if [ -f "$apk" ]; then
              echo "  File: $apk"
              ls -lh "$apk"
              echo ""
            fi
          done
        else
          echo "::error::No APK files found in .buildozer!"
          echo "This means the build failed or APK was not generated."
          exit 1
        fi
        
        # 方法 2: 复制 APK 文件
        APK_FOUND=""
        
        # 优先使用 find 找到的第一个 APK
        if [ -n "$ALL_APKS" ]; then
          FIRST_APK=$(echo "$ALL_APKS" | head -1)
          if [ -f "$FIRST_APK" ]; then
            echo ""
            echo "=== Copying first APK ==="
            echo "Source: $FIRST_APK"
            cp -v "$FIRST_APK" release/
            APK_FOUND="$FIRST_APK"
            echo "✓ Copied to release/"
          fi
        fi
        
        # 方法 3: 如果还是没找到，尝试特定路径模式
        if [ -z "$APK_FOUND" ]; then
          echo ""
          echo "=== Trying specific path patterns ==="
          # 模式 1: buildozer 1.5.0 默认路径（支持多架构）
          for pattern in \
            ".buildozer/android/platform/build-*/dist/*/bin/woaibagua-*.apk" \
            ".buildozer/android/platform/build-*/dist/*/bin/*.apk" \
            ".buildozer/android/platform/build-*/dists/*/*-debug.apk" \
            ".buildozer/android/platform/build-*/build/bootstrap_builds/*-debug.apk"; do
          
            echo "Checking pattern: $pattern"
            for apk in $pattern; do
              if [ -f "$apk" ]; then
                echo "✓ Found: $apk"
                ls -lh "$apk"
                if [ -z "$APK_FOUND" ]; then
                  cp -v "$apk" release/
                  APK_FOUND="$apk"
                  break 2
                fi
              fi
            done
          done
        fi
        
        echo ""
        echo "=== Release directory contents ==="
        ls -lah release/ || echo "No release directory or empty"
        
        # 统计 APK 数量并设置输出变量
        APK_COUNT=$(find release -name "*.apk" -type f 2>/dev/null | wc -l)
        echo ""
        echo "APK count in release/: $APK_COUNT"
        echo "apk_count=$APK_COUNT" >> $GITHUB_OUTPUT
        
        # 验证是否找到 APK
        if [ "$APK_COUNT" -eq 0 ]; then
          echo "::error::No APK files found!"
          echo "=== Debug info ==="
          echo "Working directory: $(pwd)"
          echo ".buildozer exists: $([ -d .buildozer ] && echo YES || echo NO)"
          echo "Package name: woaibagua"
          echo "Version: 1.2.0"
          echo "Expected APK name pattern: woaibagua-1.2.0-arm64-v8a.apk"
          echo ""
          echo "All .apk files in .buildozer:"
          find .buildozer -name "*.apk" -type f 2>/dev/null || echo "None found"
          exit 1
        else
          echo "✅ Successfully found $APK_COUNT APK file(s)"
          echo "APK file: $(find release -name '*.apk' -type f | head -1)"
        fi
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: woaibagua-apk-${{ github.run_number }}
        path: release/*.apk
        if-no-files-found: error
        retention-days: 30
    
    - name: Upload build logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-logs-${{ github.run_number }}
        path: |
          build.log
          .buildozer/android/platform/build-*/build.log 2>/dev/null || true
        if-no-files-found: ignore
        retention-days: 7
    
    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          release/*.apk
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build Summary
      if: always()
      run: |
        echo "=== Build Summary ==="
        echo "Build Status: ${{ job.status }}"
        echo "APK Files Found: ${{ steps.find_apk.outputs.apk_count || '0' }}"
        echo "Run Number: ${{ github.run_number }}"
        echo "Commit: ${{ github.sha }}"
