name: Build Android APK

on:
  push:
    branches: [ main, master, dev ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Clear Buildozer Cache
      run: |
        echo "=== Clearing all caches ==="
        rm -rf ~/.buildozer
        rm -rf .buildozer
        echo "✓ Cache cleared"
    
    - name: Install Buildozer
      run: |
        pip3 install --upgrade pip
        pip3 install Cython==0.29.36
        pip3 install buildozer==1.5.0
        pip3 install virtualenv
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip \
          autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev liblzma-dev \
          python3-pip python3-venv \
          libffi-dev libssl-dev \
          automake cmake \
          libgtk-3-dev
    
    - name: Configure Git and Network
      run: |
        git config --global http.sslVerify true
        git config --global http.postBuffer 524288000
        git config --global http.lowSpeedLimit 1000
        git config --global http.lowSpeedTime 300
    
    - name: Build APK
      id: build_apk
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        
        # 设置环境变量增强稳定性
        export PYTHONHTTPSVERIFY=1
        export PIP_CERT=/etc/ssl/certs/ca-certificates.crt
        export SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
        export REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
        
        # 带重试的构建
        MAX_RETRIES=3
        RETRY_COUNT=0
        BUILD_SUCCESS=false
        
        while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$BUILD_SUCCESS" = "false" ]; do
          echo "=== Build attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES ==="
          
          if buildozer android debug 2>&1 | tee build.log; then
            BUILD_SUCCESS=true
            echo "=== Build successful! ==="
          else
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "=== Build failed, retrying in 30 seconds... ==="
              sleep 30
              # 清理可能损坏的缓存
              rm -rf .buildozer/android/platform/build-*/build/bootstrap_builds
            fi
          fi
        done
        
        if [ "$BUILD_SUCCESS" = "false" ]; then
          echo "=== Build failed after $MAX_RETRIES attempts ==="
          exit 1
        fi
      timeout-minutes: 90
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Find and copy APK
      id: find_apk
      run: |
        echo "=== Searching for APK files ==="
        
        mkdir -p release
        
        # 查找所有 APK 文件
        echo "=== All APK files found ==="
        find .buildozer -name "*.apk" -type f 2>/dev/null | head -10 || echo "No APK found in .buildozer"
        
        # 复制第一个 APK
        APK_FOUND=""
        for apk in $(find .buildozer -name "*.apk" -type f 2>/dev/null | head -1); do
          if [ -f "$apk" ]; then
            echo "Found APK: $apk"
            ls -lh "$apk"
            cp -v "$apk" release/
            APK_FOUND="$apk"
            break
          fi
        done
        
        echo "=== Release directory contents ==="
        ls -lah release/ || echo "No release directory"
        
        # 统计 APK 数量
        APK_COUNT=$(find release -name "*.apk" -type f 2>/dev/null | wc -l)
        echo "APK count: $APK_COUNT"
        echo "apk_count=$APK_COUNT" >> $GITHUB_OUTPUT
        
        if [ "$APK_COUNT" -gt 0 ]; then
          echo "✅ Success"
          exit 0
        else
          echo "::error::No APK found"
          exit 1
        fi
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: woaibagua-apk-${{ github.run_number }}
        path: release/*.apk
        if-no-files-found: error
        retention-days: 30
    
    - name: Upload build logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-logs-${{ github.run_number }}
        path: |
          build.log
          .buildozer/android/platform/build-*/build.log 2>/dev/null || true
        if-no-files-found: ignore
        retention-days: 7
    
    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          release/*.apk
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build Summary
      if: always()
      run: |
        echo "=== Build Summary ==="
        echo "Build Status: ${{ job.status }}"
        echo "APK Files Found: ${{ steps.find_apk.outputs.apk_count || '0' }}"
        echo "Run Number: ${{ github.run_number }}"
        echo "Commit: ${{ github.sha }}"
